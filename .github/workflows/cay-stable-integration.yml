name: CAY STABLE integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cay-stable-integration.yml'
      - 'CAY_ANALYZER_STABLE.html'
      - '*.js'
      - 'tools/integrate_tracking_v2.py'
      - 'tools/integrate_calibration_v2.py'
      - 'tools/integrate_stable_bundle.py'
      - 'tests/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cay-stable-integration.yml'
      - 'CAY_ANALYZER_STABLE.html'
      - '*.js'
      - 'tools/integrate_tracking_v2.py'
      - 'tools/integrate_calibration_v2.py'
      - 'tools/integrate_stable_bundle.py'
      - 'tests/**'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Integrate canonical STABLE bundle
        run: python3 tools/integrate_stable_bundle.py
      - name: Verify bundle idempotency
        run: |
          cp CAY_ANALYZER_STABLE.html /tmp/cay-stable-integrated.html
          python3 tools/integrate_stable_bundle.py
          cmp --silent /tmp/cay-stable-integrated.html CAY_ANALYZER_STABLE.html || {
            echo 'ERROR: STABLE integration bundle is not idempotent'
            diff -u /tmp/cay-stable-integrated.html CAY_ANALYZER_STABLE.html || true
            exit 1
          }
          echo 'STABLE integration bundle idempotency: PASS'
      - name: Syntax check JavaScript modules
        run: |
          set -e
          for file in ./*.js; do
            echo "== syntax: $file =="
            node --check "$file"
          done
      - name: Run non-regression tests
        run: |
          set -e
          for test in tests/*.js; do
            echo "== $test =="
            node "$test"
          done
      - name: Verify HTML integration guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html_path = Path('CAY_ANALYZER_STABLE.html')
          integrator_path = Path('tools/integrate_tracking_v2.py')
          html = html_path.read_text(encoding='utf-8')
          integrator = integrator_path.read_text(encoding='utf-8')
          marker = '<!-- STABLE_LONG_TERM_TRACKING_V2 -->'

          canonical_srcs = re.findall(
              r'^\s*[\'\"]<script src=[\'\"](\./[^\'\"]+\.js)[\'\"]></script>[\'\"],\s*$',
              integrator,
              re.MULTILINE,
          )
          if not canonical_srcs:
              raise SystemExit('canonical runtime manifest could not be parsed from integrator')
          if len(canonical_srcs) != len(set(canonical_srcs)):
              raise SystemExit('duplicate script in integrator canonical runtime manifest')

          tags = [f'<script src="{src}"></script>' for src in canonical_srcs]
          missing = [src for src, tag in zip(canonical_srcs, tags) if tag not in html]
          duplicated = [src for src, tag in zip(canonical_srcs, tags) if html.count(tag) != 1]
          if missing:
              raise SystemExit('missing integration scripts: ' + ', '.join(missing))
          if duplicated:
              raise SystemExit('runtime script duplicated in HTML: ' + ', '.join(duplicated))
          if html.count(marker) != 1:
              raise SystemExit('integration marker must appear exactly once')

          positions = [html.index(tag) for tag in tags]
          if positions != sorted(positions):
              raise SystemExit('tracking runtime scripts loaded in unsafe order')

          print(f'HTML integration guards: PASS ({len(tags)} canonical runtime scripts)')
          PY
      - name: Commit validated canonical HTML integration
        if: github.event_name != 'pull_request'
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # This is the only workflow allowed to write shipped HTML. Always rebuild
          # from the latest main before committing so a stale checkout cannot be
          # rebased into a non-canonical script order.
          for attempt in 1 2 3; do
            echo "Canonical STABLE delivery attempt ${attempt}/3"
            git fetch origin main
            git reset --hard origin/main
            python3 tools/integrate_stable_bundle.py
            node tests/canonical_stable_bundle_workflows_nonregression.js

            if git diff --quiet -- CAY_ANALYZER_STABLE.html; then
              echo 'HTML already canonical on latest main; nothing to commit.'
              exit 0
            fi

            git add CAY_ANALYZER_STABLE.html
            git commit -m 'feat(stable): enable canonical stable bundle'
            if git push origin HEAD:main; then
              echo 'Canonical STABLE HTML delivered to main.'
              exit 0
            fi
            echo 'Concurrent main update detected; rebuilding from latest main.'
            sleep 1
          done

          echo 'ERROR: unable to deliver canonical STABLE bundle after 3 race-safe attempts'
          exit 1
