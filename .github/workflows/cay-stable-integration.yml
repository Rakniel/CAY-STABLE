name: CAY STABLE integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cay-stable-integration.yml'
      - 'CAY_ANALYZER_STABLE.html'
      - 'app_domain_models_v1.js'
      - 'detector_license_guard_v1.js'
      - 'detector_candidate_registry_v1.js'
      - 'detector_benchmark_v1.js'
      - 'rfdetr_onnx_adapter_v1.js'
      - 'tracking_core_v1.js'
      - 'tracking_confidence_cascade_v1.js'
      - 'tracking_two_stage_adapter_v1.js'
      - 'tracking_two_stage_runtime_patch_v1.js'
      - 'reid_evidence_fusion_v1.js'
      - 'pitch_membership_guard_v1.js'
      - 'metric_homography_projector_v1.js'
      - 'metric_segment_registry_v1.js'
      - 'metric_pitch_heatmap_v1.js'
      - 'ball_event_state_v1.js'
      - 'player_stats_v1.js'
      - 'metric_quality_guard_v1.js'
      - 'metric_publication_guard_v1.js'
      - 'tracker_state_v1.js'
      - 'replacement_events_v1.js'
      - 'observed_presence_v1.js'
      - 'observed_presence_report_v1.js'
      - 'observed_presence_runtime_bridge_v1.js'
      - 'manual_identity_merge_guard_v1.js'
      - 'segment_reid_guard_v1.js'
      - 'validated_report_bridge_v1.js'
      - 'stable_tracking_bridge_v1.js'
      - 'strict_tracking_frame_guard_v1.js'
      - 'stable_runtime_tracking_v2.js'
      - 'tools/integrate_tracking_v2.py'
      - 'tests/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cay-stable-integration.yml'
      - 'CAY_ANALYZER_STABLE.html'
      - 'app_domain_models_v1.js'
      - 'detector_license_guard_v1.js'
      - 'detector_candidate_registry_v1.js'
      - 'detector_benchmark_v1.js'
      - 'rfdetr_onnx_adapter_v1.js'
      - 'tracking_core_v1.js'
      - 'tracking_confidence_cascade_v1.js'
      - 'tracking_two_stage_adapter_v1.js'
      - 'tracking_two_stage_runtime_patch_v1.js'
      - 'reid_evidence_fusion_v1.js'
      - 'pitch_membership_guard_v1.js'
      - 'metric_homography_projector_v1.js'
      - 'metric_segment_registry_v1.js'
      - 'metric_pitch_heatmap_v1.js'
      - 'ball_event_state_v1.js'
      - 'player_stats_v1.js'
      - 'metric_quality_guard_v1.js'
      - 'metric_publication_guard_v1.js'
      - 'tracker_state_v1.js'
      - 'replacement_events_v1.js'
      - 'observed_presence_v1.js'
      - 'observed_presence_report_v1.js'
      - 'observed_presence_runtime_bridge_v1.js'
      - 'manual_identity_merge_guard_v1.js'
      - 'segment_reid_guard_v1.js'
      - 'validated_report_bridge_v1.js'
      - 'stable_tracking_bridge_v1.js'
      - 'strict_tracking_frame_guard_v1.js'
      - 'stable_runtime_tracking_v2.js'
      - 'tools/integrate_tracking_v2.py'
      - 'tests/**'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Integrate runtime into STABLE HTML
        run: python3 tools/integrate_tracking_v2.py
      - name: Verify integrator idempotency
        run: |
          cp CAY_ANALYZER_STABLE.html /tmp/cay-stable-integrated.html
          python3 tools/integrate_tracking_v2.py
          cmp --silent /tmp/cay-stable-integrated.html CAY_ANALYZER_STABLE.html || {
            echo 'ERROR: runtime integrator is not idempotent'
            diff -u /tmp/cay-stable-integrated.html CAY_ANALYZER_STABLE.html || true
            exit 1
          }
          echo 'Runtime integrator idempotency: PASS'
      - name: Syntax check JavaScript modules
        run: |
          node --check app_domain_models_v1.js
          node --check detector_license_guard_v1.js
          node --check detector_candidate_registry_v1.js
          node --check detector_benchmark_v1.js
          node --check rfdetr_onnx_adapter_v1.js
          node --check tracking_core_v1.js
          node --check tracking_confidence_cascade_v1.js
          node --check tracking_two_stage_adapter_v1.js
          node --check tracking_two_stage_runtime_patch_v1.js
          node --check reid_evidence_fusion_v1.js
          node --check pitch_membership_guard_v1.js
          node --check metric_homography_projector_v1.js
          node --check metric_segment_registry_v1.js
          node --check metric_pitch_heatmap_v1.js
          node --check ball_event_state_v1.js
          node --check player_stats_v1.js
          node --check metric_quality_guard_v1.js
          node --check metric_publication_guard_v1.js
          node --check tracker_state_v1.js
          node --check replacement_events_v1.js
          node --check observed_presence_v1.js
          node --check observed_presence_report_v1.js
          node --check observed_presence_runtime_bridge_v1.js
          node --check manual_identity_merge_guard_v1.js
          node --check segment_reid_guard_v1.js
          node --check validated_report_bridge_v1.js
          node --check stable_tracking_bridge_v1.js
          node --check strict_tracking_frame_guard_v1.js
          node --check stable_runtime_tracking_v2.js
      - name: Run non-regression tests
        run: |
          set -e
          for test in tests/*.js; do
            echo "== $test =="
            node "$test"
          done
      - name: Verify HTML integration guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CAY_ANALYZER_STABLE.html')
          s=p.read_text(encoding='utf-8')
          required=[
            '<!-- STABLE_LONG_TERM_TRACKING_V2 -->',
            './detector_license_guard_v1.js',
            './detector_candidate_registry_v1.js',
            './rfdetr_onnx_adapter_v1.js',
            './tracking_core_v1.js',
            './tracking_confidence_cascade_v1.js',
            './tracking_two_stage_adapter_v1.js',
            './tracking_two_stage_runtime_patch_v1.js',
            './reid_evidence_fusion_v1.js',
            './pitch_membership_guard_v1.js',
            './metric_homography_projector_v1.js',
            './metric_segment_registry_v1.js',
            './metric_pitch_heatmap_v1.js',
            './ball_event_state_v1.js',
            './player_stats_v1.js',
            './metric_quality_guard_v1.js',
            './metric_publication_guard_v1.js',
            './tracker_state_v1.js',
            './stable_tracking_bridge_v1.js',
            './strict_tracking_frame_guard_v1.js',
            './manual_identity_merge_guard_v1.js',
            './segment_reid_guard_v1.js',
            './observed_presence_v1.js',
            './observed_presence_report_v1.js',
            './observed_presence_runtime_bridge_v1.js',
            './stable_runtime_tracking_v2.js'
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('missing integration markers: '+', '.join(missing))
          if s.count('STABLE_LONG_TERM_TRACKING_V2') != 1: raise SystemExit('integration marker duplicated')
          order=[s.index('./detector_license_guard_v1.js'),s.index('./detector_candidate_registry_v1.js'),s.index('./rfdetr_onnx_adapter_v1.js'),s.index('./tracking_core_v1.js'),s.index('./tracking_confidence_cascade_v1.js'),s.index('./tracking_two_stage_adapter_v1.js'),s.index('./tracking_two_stage_runtime_patch_v1.js'),s.index('./reid_evidence_fusion_v1.js'),s.index('./pitch_membership_guard_v1.js'),s.index('./metric_homography_projector_v1.js'),s.index('./metric_segment_registry_v1.js'),s.index('./metric_pitch_heatmap_v1.js'),s.index('./ball_event_state_v1.js'),s.index('./player_stats_v1.js'),s.index('./metric_quality_guard_v1.js'),s.index('./metric_publication_guard_v1.js'),s.index('./tracker_state_v1.js'),s.index('./stable_tracking_bridge_v1.js'),s.index('./strict_tracking_frame_guard_v1.js'),s.index('./manual_identity_merge_guard_v1.js'),s.index('./segment_reid_guard_v1.js'),s.index('./observed_presence_v1.js'),s.index('./observed_presence_report_v1.js'),s.index('./observed_presence_runtime_bridge_v1.js'),s.index('./stable_runtime_tracking_v2.js')]
          if order != sorted(order): raise SystemExit('tracking runtime scripts loaded in unsafe order')
          print('HTML integration guards: PASS')
          PY
      - name: Commit validated HTML integration
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- CAY_ANALYZER_STABLE.html; then
            echo 'HTML already integrated; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CAY_ANALYZER_STABLE.html
          git commit -m 'feat(stable): enable long-term player tracking runtime'
          git pull --rebase origin main
          git push origin HEAD:main
